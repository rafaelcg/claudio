name: claudio

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claudio:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /claudio') ||
      startsWith(github.event.comment.body, '/claudio')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run claudio
        uses: rafaelcg/claudio/github@latest
        env:
          CLAUDIO_API_KEY: ${{ secrets.CLAUDIO_API_KEY }}
          CLAUDIO_PERMISSION: '{"bash": "deny"}'
        with:
          model: claudio/junior
